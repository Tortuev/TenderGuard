 let c=counts(r),list=r.findings.filter(f=>filter==='all'||f.status===filter);return heading('Analysis report','Inspect the requirement. Follow the evidence. Record your decision.',`${btn(icon('download')+' Export report','export-report')}${canWrite()?btn(icon('refresh')+' Reanalyse','reanalyse','primary'):''}`)+`<div class="report-heading"><div><div class="row"><h2>${esc(r.tender.title)}</h2><span class="pill no-dot">Synthetic</span></div><div class="report-meta"><span>${r.id}</span><span>Tender v${r.tender.version}</span><span>Profile v${r.profile.version}</span><span>${r.pipeline} · ${esc(r.route)} route</span></div></div><div class="coverage-box">${segments(c)}</div></div><div class="tabs">${[['matrix','Requirements & evidence'],['risks','Risks & actions'],['manifest','Input manifest'],['reviews','Human reviews']].map(([id,title])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${title}</button>`).join('')}</div>${tab==='matrix'?`<section class="card"><div class="filter-bar"><div class="chip-filters">${['all','met','unmet','unknown'].map(s=>`<button class="chip ${filter===s?'active':''}" data-filter="${s}">${s==='all'?'All findings':s[0].toUpperCase()+s.slice(1)} <span class="muted">${s==='all'?c.total:c[s]}</span></button>`).join('')}</div><span class="tiny muted">${list.length} findings · evidence-linked</span></div><div class="table-scroll"><table class="report-matrix"><thead><tr><th>ID</th><th>Tender requirement</th><th>Company evidence</th><th>Finding</th><th></th></tr></thead><tbody>${list.map(f=>`<tr><td class="mono muted">${f.id}</td><td><div class="requirement-name">${esc(f.title)}</div><span class="subline">${f.key==='iso'?'ISO 9001 required':esc(f.symbol+' '+f.target+' '+f.unit)}</span></td><td>${f.sources.length?`<span class="tiny">${esc(f.sources[0].name)}</span><span class="subline">${f.sources.length>1?f.sources.length+' source documents':esc(f.sources[0].locator)}</span>`:'<span class="tiny muted">No applicable evidence</span>'}</td><td>${pill(f.status)}</td><td>${btn('Review '+icon('chevron'),'finding','',`data-id="${f.id}"`)}</td></tr>`).join('')||'<tr><td colspan="5">No findings match this filter.</td></tr>'}</tbody></table></div><div class="card-foot">Statuses describe the selected documentary evidence, not legal eligibility or a probability of winning.</div></section>`:tab==='risks'?riskPanel(r):tab==='manifest'?manifestPanel(r):reviewPanel(r)}<div class="gap"></div><div class="note neutral"><strong>Legal applicability: not assessed.</strong> No approved legal corpus or applicability rule is selected. Legal status remains <span class="mono">legal_unknown</span>.</div>`;}
function riskPanel(r){return `<section class="card"><div class="card-head"><h2>Preparation actions</h2><span class="tiny muted">Rule-linked flags, no opaque risk score</span></div><div class="card-pad">${r.findings.filter(f=>f.status!=='met').map(f=>`<div class="list-item"><span class="round-icon ${f.status==='unmet'?'red':'amber'}">${icon('alert')}</span><div class="list-text"><strong>${esc(f.title)} · ${f.status==='unmet'?'Supported mismatch':'Clarification needed'}</strong><p>${esc(f.explanation)}</p><span class="subline">Rule DEMO-${f.key.toUpperCase()} · ${f.id}</span></div>${btn('Open finding','finding','',`data-id="${f.id}"`)}</div>`).join('')||'<p>No open documentary actions in this fixture.</p>'}</div></section>`;}
function manifestPanel(r){return `<section class="card"><div class="card-head"><h2>Frozen input selection</h2><span class="pill no-dot">Version-bound</span></div><div class="card-pad"><dl class="kv"><dt>Run</dt><dd>${r.id}</dd><dt>Tender package</dt><dd>${esc(r.tender.id)} · v${r.tender.version}</dd><dt>Profile</dt><dd>${esc(r.profile.id)} · v${r.profile.version}</dd><dt>Input fingerprint</dt><dd class="mono">${r.manifest} (illustrative, non-cryptographic)</dd><dt>Workflow</dt><dd>${r.pipeline==='B1'?'B1 · single-prompt RAG':'B2 · typed extraction, matching, reporting'}</dd><dt>Retrieval</dt><dd>Frozen synthetic evidence pack</dd><dt>Model / route</dt><dd>Demo adapter · ${esc(r.route)} · no actual inference</dd><dt>Parser / schema</dt><dd>fixture-parser · finding-schema-demo</dd><dt>Policy</dt><dd>Policy snapshot ${esc(r.policyRef||'demo-default')}</dd></dl><div class="divider"></div><h3>Selected company evidence</h3>${r.evidence.map(d=>`<div class="list-item tiny">${icon('file')}<span>${esc(d.name)} · ${esc(d.version)}<span class="subline">${esc(d.id)}</span></span></div>`).join('')}<div class="note neutral">A later file upload does not change this selection. A changed input or configuration requires a new run.</div></div></section>`;}
function reviewPanel(r){let reviews=org().reviews.filter(x=>x.run===r.id);return `<section class="card"><div class="card-head"><h2>Append-only human review</h2><span class="tiny muted">${reviews.length} events</span></div><div class="card-pad">${reviews.map(v=>`<div class="review-event"><div class="row between"><strong>${esc(v.finding)} · ${esc(v.action)}</strong><span class="muted">Demo ${esc(v.actor)}</span></div><p>${esc(v.comment)}</p><span class="subline">Original machine finding preserved · ${v.id}</span></div>`).join('')||empty('No reviews yet','Open a finding to accept, dispute or comment on it.')}</div></section>`;}
function ask(){let r=currentRun();return heading('Ask TenderGuard','Explore selected evidence without changing the original report.')+`<div class="grid cols-2"><section class="card card-pad"><h2>Ask about this run</h2><p class="card-description">${r?esc(r.id)+' · '+esc(r.tender.title):'Select a completed analysis first.'}</p><div class="gap"></div><div class="examples">${['Does delivery meet the deadline?','Which warranty offer applies?','Жедел жад талабы қандай?'].map(q=>`<button data-question="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="gap"></div><form id="qa-form"><div class="field"><label for="question-input">Your question</label><textarea id="question-input" placeholder="Ask about delivery, RAM, warranty or certification…" ${!canWrite()?'disabled':''} required></textarea></div><div class="gap"></div><div class="row between"><span class="tiny muted">Illustrative answers from authored fixtures</span><button class="btn primary" ${!canWrite()?'disabled':''}>Ask with evidence ${icon('arrow')}</button></div></form><div id="answer-area">${questionReply||''}</div></section><section class="card card-pad"><h2>Evidence boundary</h2><div class="gap"></div><div class="list-text">Answers use the current run's selected tender and company sources.<p>Unselected documents and later revisions stay outside the answer. Questions with no authored matching evidence return insufficient evidence.</p></div><div class="divider"></div><div class="note neutral">This prototype does not call an LLM. Its answers illustrate supported, insufficient-evidence and blocked outcomes.</div>${!canWrite()?'<div class="gap"></div><div class="note warn">Viewer access is read-only. Asking questions creates a new record and requires Member or Owner.</div>':''}</section></div>`;}
function runs(){return heading('Analysis runs','Each run preserves its selected inputs, outcome and configuration.',canWrite()?btn(icon('plus')+' New analysis','new-analysis','primary'):'')+`<section class="card"><div class="card-head"><h2>Run history</h2><span class="tiny muted">${org().runs.length} runs</span></div>${org().runs.length?`<div class="table-scroll"><table><thead><tr><th>Run</th><th>Input versions</th><th>Workflow / route</th><th>Processing outcome</th><th></th></tr></thead><tbody>${[...org().runs].reverse().map(r=>`<tr><td><strong>${r.id}</strong><span class="subline">${esc(r.tender.title)}</span></td><td>Tender v${r.tender.version}<span class="subline">Company profile v${r.profile.version}</span></td><td>${r.pipeline}<span class="subline">${esc(r.route)} · demo adapter</span></td><td>${pill(r.state)}<span class="subline">${esc(r.state==='completed'?counts(r).total+' findings':r.reason||'Waiting for processing')}</span></td><td>${btn('Open','open-run','',`data-id="${r.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('No runs yet','Create an analysis to inspect its processing state.')}</section>`;}
function runPanel(r){return `<section class="card"><div class="card-head"><div><h2>${r.id} · ${esc(r.tender.title)}</h2><p class="card-description">Synthetic workflow simulation</p></div>${pill(r.state)}</div><div class="card-pad"><div class="run-stages">${['Ingestion','Extraction','Assessment','Reporting'].map((name,i)=>`<div class="run-stage ${i<r.stage?'done':i===r.stage&&r.state==='running'?'active':''}">${i+1}. ${name}</div>`).join('')}</div><div class="note ${['failed','blocked'].includes(r.state)?'error':'neutral'}" role="status">${esc(r.reason||(r.state==='queued'?'Queued for the demo worker.':r.state==='running'?'Simulating typed stages. No model calls are made.':'Processing has ended.'))}</div><div class="gap"></div><div class="row">${['queued','running'].includes(r.state)&&canWrite()?btn('Cancel run','cancel-run','danger',`data-id="${r.id}"`):canWrite()?btn('Create retry run','retry-run','primary',`data-id="${r.id}"`):''}${btn('View run history','show-runs')}</div></div><div class="card-foot">A processing failure or policy block does not assign met/unmet/unknown to the company.</div></section>`;}
function evaluation(){return heading('Evaluation workspace','Inspect the planned comparison without presenting simulated metrics as measurements.')+`<div class="note neutral">Research preview · the dataset, scorer and model runtimes are not connected. All metrics remain unmeasured.</div><div class="gap"></div><section class="card"><div class="card-head"><h2>Paired configuration</h2>${canWrite()?btn(icon('flask')+' Preview experiment','preview-evaluation','primary'):''}</div><div class="table-scroll"><table><thead><tr><th>Variant</th><th>Method</th><th>Evidence</th><th>Quality</th><th>Latency / usage</th></tr></thead><tbody><tr><td><strong>B0</strong><span class="subline">Retrieval reference</span></td><td>Lexical retrieval only</td><td>Common permitted corpus</td><td>Not measured<span class="subline">Status F1 not applicable</span></td><td>Not measured</td></tr><tr><td><strong>B1</strong><span class="subline">Primary comparator</span></td><td>One generation call</td><td>Frozen original evidence pack</td><td>Not measured</td><td>Not measured</td></tr><tr><td><strong>B2</strong><span class="subline">Staged candidate</span></td><td>Typed extraction, assessment, report</td><td>Same original evidence / generator</td><td>Not measured</td><td>Not measured</td></tr></tbody></table></div></section><div class="gap"></div><div class="grid equal"><section class="card card-pad"><h2>Measurement plan</h2><div class="gap"></div>${[['Retrieval','Recall@5/@10 and complete-evidence success'],['Documentary fit','Extraction F1, status macro-F1 and false passes'],['Evidence quality','Locator validity, citation support and coverage'],['Resource use','Every stage, retry, token, failure and cost']].map(([a,b])=>`<div class="list-item"><div class="list-text"><strong>${a}</strong><p>${b}</p></div></div>`).join('')}</section><section class="card card-pad"><h2>Freeze and partition</h2><div class="gap"></div><dl class="kv"><dt>Split unit</dt><dd>Connected document family</dd><dt>Languages</dt><dd>RU / KK reported separately</dd><dt>Model selection</dt><dd>Development data only</dd><dt>Test partition</dt><dd>Held out until configuration freeze</dd><dt>Reference labels</dt><dd>Independent annotation and adjudication</dd><dt>Failures</dt><dd>Retained in experiment accounting</dd></dl><div class="divider"></div><div class="tiny muted">No corpus counts or quality gains are claimed as achieved here.</div></section></div>`;}
function privacy(){let p=org().policy;return heading('Privacy & processing','Define permitted routes before confidential context reaches a model.')+`<div class="grid equal"><section class="card card-pad"><div class="row between"><h2>Processing policy</h2>${pill('ready','Demo policy')}</div><div class="gap"></div><div class="field"><label for="hosted-public">Public documents → approved hosted route</label><select id="hosted-public" ${!isOwner()?'disabled':''}><option value="true" ${p.hostedPublic?'selected':''}>Permitted</option><option value="false" ${!p.hostedPublic?'selected':''}>Blocked</option></select></div><div class="gap"></div><div class="field"><label for="hosted-private">Private evidence → hosted route</label><select id="hosted-private" ${!isOwner()?'disabled':''}><option value="false" ${!p.hostedPrivate?'selected':''}>Blocked</option><option value="true" ${p.hostedPrivate?'selected':''}>Permitted for this synthetic demo</option></select><small>Changing this preview does not authorize real company data transfer.</small></div><div class="gap"></div><div class="field"><label for="local-available">Local runtime availability</label><select id="local-available" ${!isOwner()?'disabled':''}><option value="true" ${p.localAvailable?'selected':''}>Available (simulated)</option><option value="false" ${!p.localAvailable?'selected':''}>Unavailable (simulated)</option></select></div><div class="gap"></div>${isOwner()?btn('Save demo policy','save-policy','primary'):'<div class="note neutral">Only the Owner can change policy. Use the preview role selector to inspect that flow.</div>'}</section><section class="card card-pad"><h2>Route decision preview</h2><p class="card-description">A data class and destination produce an explicit outcome.</p><div class="gap"></div><div class="form-grid"><div class="field"><label for="test-class">Context classification</label><select id="test-class"><option value="private">Private company evidence</option><option value="public">Public tender only</option></select></div><div class="field"><label for="test-route">Destination</label><select id="test-route"><option value="hosted">Hosted provider</option><option value="local">Local runtime</option></select></div></div><div class="gap"></div>${btn('Check route','test-policy')}<div id="policy-result" class="gap"></div><div class="divider"></div><div class="list-text"><strong>No silent fallback</strong><p>An unavailable local route does not permit external processing. Restrictions also apply to derived summaries, retries and schema repairs.</p></div></section></div><div class="gap"></div><div class="note neutral">Runtime enforcement, retention/deletion targets, egress controls and actual isolation tests are design requirements. This page only simulates policy choices in your browser.</div>`;}
function team(){return heading('Team & access','Preview organization membership and role-based actions.',isOwner()?btn(icon('plus')+' Add demo member','add-member','primary'):'')+`<section class="card"><div class="card-head"><h2>${esc(orgInfo().name)}</h2><span class="tiny muted">Synthetic people · no invitations sent</span></div><div class="table-scroll"><table><thead><tr><th>Member</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody>${org().members.map(m=>`<tr><td><div class="row"><span class="avatar">${m.initials}</span><div><strong>${esc(m.name)}</strong><span class="subline">${m.id==='m1'?'Organization owner':'Synthetic team member'}</span></div></div></td><td>${isOwner()&&m.id!=='m1'?`<select class="small-select" data-member-role="${m.id}" aria-label="Role for ${esc(m.name)}">${['member','viewer'].map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select>`:esc(m.role)}</td><td>${pill(m.active?'ready':'cancelled',m.active?'Active':'Revoked')}</td><td>${isOwner()&&m.id!=='m1'?btn(m.active?'Revoke access':'Restore access','toggle-member',m.active?'danger':'',`data-id="${m.id}"`):''}</td></tr>`).join('')}</tbody></table></div><div class="card-foot">The top-bar role selector changes your simulated persona. Membership records here illustrate administration, not actual identity enforcement.</div></section><div class="gap"></div><div class="grid equal">${[['Member','Create inputs, start runs, ask questions and record reviews.'],['Viewer','Read permitted reports and source citations. All write actions are restricted.']].map(([a,b])=>`<div class="card card-pad"><h2>${a}</h2><p class="card-description">${b}</p></div>`).join('')}</div>`;}
function auditPage(){if(!isOwner())return heading('Activity log','Safe operational events for the organization owner.')+`<div class="card">${empty('Owner access required','Members and viewers cannot open audit administration. Switch the preview role to Owner.')}</div>`;return heading('Activity log','Metadata only. No raw documents, prompts, secrets or confidential quotations.')+`<section class="card"><div class="card-head"><h2>Workspace events</h2><span class="tiny muted">${org().audit.length} local events</span></div>${org().audit.length?`<div class="table-scroll"><table><thead><tr><th>Action</th><th>Actor</th><th>Reference</th><th>Outcome</th></tr></thead><tbody>${org().audit.map(a=>`<tr><td>${esc(a.action)}</td><td>Demo ${esc(a.actor)}</td><td class="mono">${esc(a.ref||'—')}</td><td>${pill(a.outcome)}</td></tr>`).join('')}</tbody></table></div>`:empty('No events recorded','Create a run or update a demo policy to see metadata-only events.')}</section>`;}
function extensions(){return heading('Optional extensions','Explore future interactions without expanding the core acceptance scope.')+`<div class="grid equal"><section class="card card-pad"><div class="row between"><h2>Tender revision comparison</h2><span class="extension-label">Optional</span></div><p class="card-description">A source-linked change, not a rewritten historical report.</p><div class="gap"></div><div class="version-diff"><div><div class="eyebrow">Tender v1 · Clause 3.1</div><div class="quote">Delivery within <del>10 calendar days</del> after contract signature.</div></div><div><div class="eyebrow">Tender v2 · Clause 3.1</div><div class="quote">Delivery within <ins>7 calendar days</ins> after contract signature.</div></div></div><div class="gap"></div>${canWrite()?btn('Create revised-tender run','revision-run'):''}</section><section class="card card-pad"><div class="row between"><h2>OCR for scanned files</h2><span class="extension-label">Optional</span></div><div class="gap"></div><div class="note warn">Core processing rejects image-only scans with an explicit unsupported outcome. OCR would require its own quality checks.</div><div class="gap"></div>${btn('Preview OCR states','ocr-preview')}<div id="ocr-result"></div></section><section class="card card-pad"><div class="row between"><h2>Report download</h2><span class="extension-label">Should</span></div><p class="card-description">Download the current synthetic report with its input references and citations.</p><div class="gap"></div>${btn(icon('download')+' Download HTML report','export-report')}</section><section class="card card-pad"><div class="row between"><h2>Local model & adaptation</h2><span class="extension-label">Optional</span></div><p class="card-description">Configuration preview only. No model is downloaded or trained.</p><div class="gap"></div>${btn('Inspect readiness gates','model-gates')}</section></div>`;}

/* Interaction handlers and dialogs follow below. */

function modal(title,body,foot='',drawer=false){if(!$('#overlay-root').children.length)lastFocus=document.activeElement;$('#overlay-root').innerHTML=`<div class="modal-backdrop ${drawer?'drawer-mode':''}"><section class="modal ${drawer?'drawer':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><div><h2 id="dialog-title">${title}</h2></div>${btn(icon('x'),'close','icon','aria-label="Close dialog"')}</header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>$('#overlay-root button, #overlay-root input')?.focus(),0);}
function close(){if(wizard)wizard=null;$('#overlay-root').innerHTML='';document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus();else $('#main')?.focus();}
function routeCheck(route,privateContext=true){let p=org().policy;if(route==='local')return p.localAvailable?{ok:true,message:'Approved local route. This is a browser-only decision preview.'}:{ok:false,kind:'failed',message:'Approved local runtime unavailable. No hosted fallback is permitted.'};let ok=privateContext?p.hostedPrivate:p.hostedPublic;return ok?{ok:true,message:'Hosted route permitted by the synthetic demo policy. No request is actually sent.'}:{ok:false,kind:'blocked',message:'Processing blocked: selected context is not permitted on the hosted route. No content was transmitted.'};}
function showFinding(id){let r=currentRun(),f=r?.findings?.find(f=>f.id===id);if(!f)return toast('Open a completed run first.');let reviews=org().reviews.filter(v=>v.run===r.id&&v.finding===f.id);modal(`${esc(f.title)} ${pill(f.status)}`,`<div class="row between"><span class="mono muted">${f.id} · ${r.id}</span><span class="pill no-dot">${esc(r.tender.language)}</span></div><div class="gap"></div><h3>Assessment</h3><p class="card-description">${esc(f.explanation)}</p><div class="divider"></div><div class="source-head">TENDER SOURCE · ${esc(r.tender.docs[0]?.name||'Selected tender')} · v${r.tender.version}</div><span class="tiny muted">${esc(f.location)}</span><blockquote class="quote">${esc(f.tenderQuote)}</blockquote><div class="divider"></div><h3>Company evidence</h3>${f.sources.length?f.sources.map(d=>`<div class="gap"></div><div class="source-head">${esc(d.name)} · ${esc(d.version)}</div><span class="tiny muted">${esc(d.locator)}</span><blockquote class="quote">${esc(d.quote)}</blockquote>`).join(''):'<div class="gap"></div><div class="note warn">No applicable company source is selected. The system preserves unknown and requests evidence.</div>'}<div class="divider"></div><h3>Human review</h3><p class="card-description">Review events do not overwrite the original finding.</p>${canWrite()?`<form id="review-form" data-finding="${f.id}"><div class="gap"></div><div class="field"><label for="review-action">Review action</label><select id="review-action"><option value="Comment">Comment</option><option value="Accept">Accept finding</option><option value="Dispute">Dispute finding</option></select></div><div class="gap"></div><div class="field"><label for="review-comment">Comment or correction</label><textarea id="review-comment" required maxlength="1500" placeholder="Explain your review and what evidence is needed…"></textarea></div><div class="gap"></div><button class="btn primary">Save review event</button></form>`:'<div class="gap"></div><div class="note neutral">Viewer access: sources and existing reviews are readable, but creating a review requires Member or Owner.</div>'}<div id="finding-reviews">${reviews.map(v=>`<div class="review-event"><strong>${esc(v.action)}</strong><p>${esc(v.comment)}</p><span class="subline">Demo ${esc(v.actor)} · original output preserved</span></div>`).join('')}</div>`,btn('Close','close'),true);}
function tenderDetail(id){let t=org().tenders.find(t=>t.id===id);if(!t)return;modal(esc(t.title),`<dl class="kv"><dt>Tender</dt><dd>${t.id}</dd><dt>Buyer</dt><dd>${esc(t.buyer)}</dd><dt>Category</dt><dd>${esc(t.category)}</dd><dt>Language</dt><dd>${esc(t.language)}</dd><dt>Package</dt><dd>Version ${t.version}</dd></dl><div class="divider"></div><h3>Selected tender documents</h3><div class="gap"></div>${t.docs.map(d=>`<div class="list-item">${icon('file')}<div><strong class="tiny">${esc(d.name)}</strong><span class="subline">${esc(d.version)} · ${esc(d.language)}</span></div><span class="spacer"></span>${pill(d.state)}</div>`).join('')||'<div class="note neutral">Attach a tender document before starting analysis.</div>'}`,`${canWrite()?btn('Attach document','upload-tender','',`data-id="${t.id}"`):''}<span class="spacer"></span>${canWrite()?btn('Analyse this tender','analyse-tender','primary',`data-id="${t.id}"`):btn('Close','close')}`);}
function uploadDialog(kind,tenderId){if(!guard())return;modal(kind==='company'?'Add company evidence':'Attach tender document',`<form id="upload-form" data-kind="${kind}" data-tender="${tenderId||''}"><div class="dropzone">${icon('upload')}<h3>Choose a PDF or DOCX file</h3><p>File selection stays in this browser. No file bytes are uploaded or parsed.</p><input type="file" id="upload-file" accept=".pdf,.docx" aria-label="Select PDF or DOCX document"></div><div class="gap"></div><div class="form-grid"><div class="field"><label for="upload-language">Document language</label><select id="upload-language"><option>RU</option><option>KK</option></select></div><div class="field"><label for="upload-class">Classification</label><select id="upload-class"><option value="${kind==='company'?'private':'public'}">${kind==='company'?'Private — company evidence':'Public — tender document'}</option></select></div><div class="field full"><label for="upload-state">Demonstration outcome</label><select id="upload-state"><option value="ready">Metadata ready (mock ingestion)</option><option value="failed">Corrupt document / parsing failure</option><option value="unsupported">Image-only scan — OCR unsupported</option><option value="upload-failed">Upload interrupted</option></select></div></div><div class="gap"></div><div class="note neutral">25 MB is a provisional prototype limit. Adding company metadata creates a new profile version. It does not automatically establish evidence for a company claim.</div><div id="upload-error" role="alert"></div><div class="gap"></div><button class="btn primary">Validate & add metadata</button></form>`);}
function newTender(){if(!guard())return;modal('Create tender workspace',`<form id="tender-form"><div class="form-grid"><div class="field full"><label for="tender-title">Tender title</label><input id="tender-title" required maxlength="100" placeholder="e.g. Laptop supply · 40 units"></div><div class="field full"><label for="tender-buyer">Buyer / organization</label><input id="tender-buyer" required maxlength="100" placeholder="Synthetic buyer name"></div><div class="field"><label for="tender-language">Language</label><select id="tender-language"><option>RU</option><option>KK</option><option>RU / KK</option></select></div><div class="field"><label for="tender-category">Category</label><select id="tender-category"><option>IT equipment</option><option>Office equipment</option></select></div></div><div class="gap"></div><div class="note neutral">A workspace starts without documents. Uploaded content is not parsed in this prototype; analysis uses the authored laptop-requirement fixture.</div><div class="gap"></div><button class="btn primary">Create workspace</button></form>`);}
function editProfile(){if(!guard())return;let p=profile();modal('Create a new company profile version',`<form id="profile-form"><div class="note neutral">This authors synthetic company facts and a matching declaration document. Original versions and existing runs remain unchanged.</div><div class="gap"></div><div class="form-grid">${[['goods','Goods / services','text',p.goods],['ram','RAM (GB)','number',p.ram],['storage','SSD capacity (GB)','number',p.storage],['delivery','Delivery (calendar days)','number',p.delivery],['quantity','Available laptops','number',p.quantity]].map(([id,label,type,val])=>`<div class="field ${id==='goods'?'full':''}"><label for="fact-${id}">${label}</label><input id="fact-${id}" type="${type}" value="${esc(val)}" required ${type==='number'?'min="1" max="100000"':''}></div>`).join('')}<div class="field"><label for="fact-warranty">Applicable warranty</label><select id="fact-warranty"><option value="unknown">Unresolved / missing</option><option value="12" ${p.warranty===12?'selected':''}>12 months confirmed</option><option value="36" ${p.warranty===36?'selected':''}>36 months confirmed</option></select></div><div class="field"><label for="fact-iso">Applicable ISO 9001 evidence</label><select id="fact-iso"><option value="false">Missing</option><option value="true" ${p.iso?'selected':''}>Confirmed in synthetic declaration</option></select></div></div><div class="gap"></div><button class="btn primary">Save new version</button></form>`);}
function openWizard(tenderId,oldRun){if(!guard())return;let t=org().tenders.find(t=>t.id===tenderId)||org().tenders.find(t=>t.docs.some(d=>d.state==='ready'));if(!t){toast('Create a tender and attach a ready document first.');go('tenders');return;}wizard={step:1,tenderId:t.id,profileId:org().profiles.at(-1).id,evidence:clone(org().profiles.at(-1).evidence),route:oldRun?.route||'local',pipeline:oldRun?.pipeline||'B2',scenario:'success'};showWizard();}
function showWizard(){let w=wizard,t=org().tenders.find(t=>t.id===w.tenderId),p=org().profiles.find(p=>p.id===w.profileId);let body=`<div class="stepper">${['Inputs','Evidence','Processing','Confirm'].map((x,i)=>`<span class="step ${w.step===i+1?'current':''}"><b>${i+1}</b>${x}</span>${i<3?'<span class="steps-line"></span>':''}`).join('')}</div>`;
 if(w.step===1)body+=`<div class="stack"><div class="field"><label for="wizard-tender">Tender package</label><select id="wizard-tender">${org().tenders.map(t=>`<option value="${t.id}" ${t.id===w.tenderId?'selected':''}>${esc(t.title)} · v${t.version}</option>`).join('')}</select></div><div class="field"><label for="wizard-profile">Company profile</label><select id="wizard-profile">${org().profiles.map(p=>`<option value="${p.id}" ${p.id===w.profileId?'selected':''}>${orgInfo().name} · profile v${p.version}</option>`).join('')}</select></div><div class="note ${t.docs.length&&t.docs.every(d=>d.state==='ready')?'neutral':'error'}">${t.docs.length&&t.docs.every(d=>d.state==='ready')?`${t.docs.length} ready tender document(s). This prototype uses authored laptop requirements, not extracted file content.`:'This package has no documents or contains failed inputs. Resolve ingestion before starting.'}</div></div>`;
 if(w.step===2)body+=`<h3>Select the evidence for this run</h3><p class="card-description">Only selected ready evidence can support the findings.</p>${org().documents.filter(d=>p.evidence.includes(d.id)).map(d=>`<label class="select-row"><input type="checkbox" name="run-evidence" value="${d.id}" ${d.state==='ready'&&w.evidence.includes(d.id)?'checked':''} ${d.state!=='ready'?'disabled':''}><span><strong>${esc(d.name)}</strong><small>${esc(d.version)} · ${esc(d.language)} · ${esc(d.class)} · ${esc(d.state)}</small></span></label>`).join('')}<div class="gap"></div><div class="note neutral">Omitted supporting evidence can produce unknown. A selected file with no validated fact does not prove compliance.</div>`;
 if(w.step===3)body+=`<div class="field"><label for="wizard-pipeline">Analysis workflow</label><select id="wizard-pipeline"><option value="B2" ${w.pipeline==='B2'?'selected':''}>B2 · typed extraction, assessment, report</option><option value="B1" ${w.pipeline==='B1'?'selected':''}>B1 · one generation call</option></select></div><div class="gap"></div><h3>Processing destination</h3>${[['local','Approved local runtime','Restricted evidence stays on the selected internal route.'],['hosted','Approved hosted provider','The policy must permit every selected private source.']].map(([id,label,desc])=>`<label class="route-option"><input type="radio" name="wizard-route" value="${id}" ${w.route===id?'checked':''}><div><strong>${label}</strong><p>${desc}</p></div></label>`).join('')}<div class="gap"></div><div class="field"><label for="wizard-scenario">Preview processing outcome</label><select id="wizard-scenario"><option value="success">Complete the simulated workflow</option><option value="provider-failure" ${w.scenario==='provider-failure'?'selected':''}>Provider unavailable</option><option value="invalid-output" ${w.scenario==='invalid-output'?'selected':''}>Invalid stage output</option></select></div>`;
 if(w.step===4){let d=routeCheck(w.route,true);body+=`<dl class="kv"><dt>Tender</dt><dd>${esc(t.title)} · v${t.version}</dd><dt>Company profile</dt><dd>v${p.version}</dd><dt>Selected evidence</dt><dd>${w.evidence.length} exact document versions</dd><dt>Workflow / route</dt><dd>${w.pipeline} · ${w.route}</dd><dt>Outcome preview</dt><dd>${esc(w.scenario)}</dd></dl><div class="gap"></div><div class="note ${d.ok?'neutral':'error'}">${esc(d.message)}</div><div class="gap"></div><div class="tiny muted">Inputs are frozen for the new run. All generated findings are fixture-derived simulation, not AI analysis.</div>`;}
 modal('New analysis',body,`${w.step>1?btn('Back','wizard-back'):btn('Cancel','close')}<span class="tiny muted">Step ${w.step} of 4</span>${btn(w.step===4?'Create simulated run':'Continue','wizard-next','primary')}`);}
function readWizard(){if(!wizard)return;let w=wizard;if(w.step===1){w.tenderId=$('#wizard-tender').value;let profileId=$('#wizard-profile').value;if(profileId!==w.profileId){w.profileId=profileId;w.evidence=clone(org().profiles.find(p=>p.id===w.profileId).evidence);}}if(w.step===2)w.evidence=$$('input[name="run-evidence"]:checked:not(:disabled)').map(i=>i.value);if(w.step===3){w.pipeline=$('#wizard-pipeline').value;w.route=$('input[name="wizard-route"]:checked').value;w.scenario=$('#wizard-scenario').value;}}
function launch(w){let o=org(),t=o.tenders.find(x=>x.id===w.tenderId),p=o.profiles.find(x=>x.id===w.profileId);if(!t?.docs.length||t.docs.some(d=>d.state!=='ready'))return toast('All tender inputs must be ready before analysis.');let evidence=clone(o.documents.filter(d=>w.evidence.includes(d.id)&&d.state==='ready'));let decision=routeCheck(w.route,true);let id='RUN-'+String(o.nextRun++).padStart(3,'0');let r={id,tender:clone(t),profile:clone(p),evidence,pipeline:w.pipeline,route:w.route,scenario:w.scenario,actor:state.role,state:decision.ok?'queued':decision.kind,stage:0,reason:decision.ok?'':decision.message,policyRef:'demo-policy-'+o.audit.length};r.manifest=fingerprint(r);o.runs.push(r);activeRunId=id;filter='all';tab='matrix';close();page='report';audit('Analysis requested',r.state,id);render();if(decision.ok)advance(id,state.org);}
function advance(id,orgId){jobTimers[orgId+':'+id]=setTimeout(()=>{let o=state.data[orgId],r=o.runs.find(x=>x.id===id);if(!r||!['queued','running'].includes(r.state))return;let policy=o.policy,allow=r.route==='local'?policy.localAvailable:policy.hostedPrivate;if(!allow){r.state=r.route==='local'?'failed':'blocked';r.reason='The approved route became unavailable or restricted. No fallback was used.';}else if(r.scenario!=='success'&&r.stage===2){r.state='failed';r.reason=r.scenario==='provider-failure'?'The approved model route is unavailable. No alternate provider was used.':'A stage returned an invalid schema or evidence reference. No completed report was published.';}else{r.state='running';r.stage++;if(r.stage>=4){r.state='completed';r.reason='';r.findings=assess(r);o.audit.unshift({action:'Analysis simulation completed',outcome:'completed',ref:id,actor:r.actor||'member'});}}save();if(state.org===orgId&&state.signedIn&&(['overview','runs'].includes(page)||(page==='report'&&activeRunId===id)))render();if(r.state==='running')advance(id,orgId);},850);}
function exportReport(){let r=currentRun();if(!r||r.state!=='completed')return toast('Select a completed report before exporting.');let c=counts(r),html=`<!doctype html><html lang="en"><meta charset="utf-8"><title>TenderGuard ${r.id}</title><style>body{font:15px/1.7 Arial;max-width:1000px;margin:50px auto;padding:20px;color:#172924}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:12px;text-align:left}small{color:#68776b}</style><h1>TenderGuard — synthetic report</h1><p>${esc(r.tender.title)} · ${r.id} · Tender v${r.tender.version} · Profile v${r.profile.version}</p><p>${c.met} met / ${c.unmet} unmet / ${c.unknown} unknown</p><p>Workflow ${r.pipeline}; route ${esc(r.route)}; input fingerprint ${r.manifest}. These are browser-local fixture-derived findings, not model results or legal approval.</p><table><tr><th>Requirement</th><th>Status / explanation</th><th>Sources</th></tr>${r.findings.map(f=>`<tr><td>${f.id}: ${esc(f.requirement)}</td><td>${f.status}<p>${esc(f.explanation)}</p></td><td>Tender v${r.tender.version} · ${esc(f.location)}<blockquote>${esc(f.tenderQuote)}</blockquote>${f.sources.map(d=>`<p>${esc(d.name)} · ${esc(d.version)} · ${esc(d.locator)}</p><blockquote>${esc(d.quote)}</blockquote>`).join('')||'<p>No applicable company evidence.</p>'}</td></tr>`).join('')}</table><h2>Selected input documents</h2><ul>${r.evidence.map(d=>`<li>${esc(d.id)} · ${esc(d.name)} · ${esc(d.version)}</li>`).join('')}</ul><p>Legal applicability: legal_unknown.</p></html>`;download(html,'TenderGuard-'+r.id+'.html','text/html');audit('Synthetic report exported','completed',r.id);toast('Downloaded the current synthetic report with source references.');}
function download(content,name,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function question(q){let r=currentRun();if(!guard())return;if(!r||r.state!=='completed')return toast('Select a completed run first.');let decision=routeCheck(r.route,true);let f;if(/deliver|срок|жеткіз/i.test(q))f=r.findings.find(f=>f.key==='delivery');else if(/warrant|гарант|кепіл/i.test(q))f=r.findings.find(f=>f.key==='warranty');else if(/ram|жад|памят/i.test(q))f=r.findings.find(f=>f.key==='ram');else if(/certif|iso|сертифик/i.test(q))f=r.findings.find(f=>f.key==='iso');let answer=!decision.ok?`<div class="note error">${esc(decision.message)}</div>`:f?`<div class="qa-answer"><div class="row between"><strong>Illustrative evidence-grounded answer</strong>${pill(f.status)}</div><div class="gap"></div><p>${esc(f.requirement)} ${esc(f.explanation)}</p><div class="gap"></div>${btn('Inspect cited sources','finding','',`data-id="${f.id}"`)}<div class="subline">${f.id} · ${r.id} · original report unchanged</div></div>`:`<div class="note warn"><strong>Insufficient evidence.</strong> The selected fixture has no authored supporting answer to this question. No answer was invented.</div>`;questionReply=`<div class="qa-question">${esc(q)}</div>${answer}`;$('#answer-area').innerHTML=questionReply;audit('Question preview',decision.ok?'completed':decision.kind,r.id);}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.filter){filter=b.dataset.filter;render();return;}if(b.dataset.question){$('#question-input').value=b.dataset.question;question(b.dataset.question);return;}let a=b.dataset.act,id=b.dataset.id;if(!a)return;
 const handlers={close,'reset-dialog':()=>modal('Reset this prototype?', '<p class="muted">Restore the original synthetic records in both demo organizations. This only clears this prototype’s browser-local changes.</p>',btn('Cancel','close')+btn('Reset synthetic records','reset-confirm','danger')),'reset-confirm':()=>{for(const timer of Object.values(jobTimers))clearTimeout(timer);state=initial();activeRunId='RUN-002';selectedProfile=2;page='overview';tab='matrix';filter='all';save();close();render();toast('Original synthetic records restored.');},menu:()=>$('.layout').classList.toggle('menu-open'),signin:()=>{state.role=$('#login-role').value;state.signedIn=true;save();render();},signout:()=>{state.signedIn=false;close();save();render();},'new-analysis':()=>openWizard(),'new-tender':newTender,'tender-detail':()=>tenderDetail(id),'upload-company':()=>uploadDialog('company'),'upload-tender':()=>uploadDialog('tender',id),'analyse-tender':()=>openWizard(id),'edit-profile':editProfile,finding:()=>showFinding(id),'show-runs':()=>go('runs'),'open-run':()=>{activeRunId=id;tab='matrix';filter='all';go('report');},reanalyse:()=>openWizard(currentRun()?.tender.id,currentRun()),'retry-run':()=>openWizard(org().runs.find(x=>x.id===id)?.tender.id,org().runs.find(x=>x.id===id)),'cancel-run':()=>{if(!guard())return;let r=org().runs.find(x=>x.id===id);if(r&&['queued','running'].includes(r.state)){r.state='cancelled';r.reason='Cancelled by the analyst. No completed report was published.';clearTimeout(jobTimers[state.org+':'+id]);audit('Run cancelled','cancelled',id);render();}},'wizard-back':()=>{readWizard();wizard.step--;showWizard();},'wizard-next':()=>{if(!guard())return;readWizard();if(wizard.step===1){let t=org().tenders.find(t=>t.id===wizard.tenderId);if(!t.docs.length||t.docs.some(d=>d.state!=='ready'))return toast('Attach successfully ingested tender inputs first.');}if(wizard.step<4){wizard.step++;showWizard();}else launch(clone(wizard));},'export-report':exportReport,'inspect-document':()=>{let d=org().documents.find(d=>d.id===id);if(!d)return;modal(esc(d.name),`<span class="pill no-dot">${esc(d.class)} · ${esc(d.version)} · ${esc(d.language)}</span><div class="gap"></div><div class="source-head">${esc(d.locator||'No parsed source location')}</div><blockquote class="quote">${esc(d.quote||'This uploaded file has metadata only. No text was extracted in the prototype.')}</blockquote><div class="gap"></div><div class="note neutral">Exact document reference: ${esc(d.id)}. This is synthetic source text, not the contents of a selected real file.</div>`,btn('Close','close'),true);},'save-policy':()=>{if(!guard(true))return;org().policy={hostedPublic:$('#hosted-public').value==='true',hostedPrivate:$('#hosted-private').value==='true',localAvailable:$('#local-available').value==='true'};audit('Processing policy updated');toast('Demo policy saved. No real network access was changed.');render();},'test-policy':()=>{let d=routeCheck($('#test-route').value,$('#test-class').value==='private');$('#policy-result').innerHTML=`<div class="note ${d.ok?'neutral':'error'}" role="status">${esc(d.message)}</div>`;},'add-member':()=>{if(!guard(true))return;modal('Add synthetic team member',`<form id="member-form"><div class="field"><label for="member-name">Display name</label><input id="member-name" required maxlength="60" placeholder="Demo teammate"></div><div class="gap"></div><div class="field"><label for="member-role">Role</label><select id="member-role"><option>member</option><option>viewer</option></select></div><div class="gap"></div><div class="note neutral">Browser-local record only. No account or invitation is created.</div><div class="gap"></div><button class="btn primary">Add demo member</button></form>`);},'toggle-member':()=>{if(!guard(true))return;let m=org().members.find(m=>m.id===id);if(m&&m.id!=='m1'){m.active=!m.active;audit(m.active?'Member access restored':'Member access revoked','completed',m.id);render();}},'preview-evaluation':()=>{if(!guard())return;modal('Experiment preview',`<div class="note neutral">Configuration inspection only. No benchmark is executed.</div><div class="gap"></div><dl class="kv"><dt>Variants</dt><dd>B0 retrieval / B1 single call / B2 stages</dd><dt>Evidence</dt><dd>Same frozen synthetic input pack for B1/B2</dd><dt>Language slices</dt><dd>RU and KK</dd><dt>Model snapshot</dt><dd>Not connected</dd><dt>Measured metrics</dt><dd>Not available</dd><dt>Failures</dt><dd>Must remain in accounting</dd></dl><div class="gap"></div><p class="tiny muted">A schema check or authored reference label is not a measured model-quality result.</p>`,btn('Close','close'));},'ocr-preview':()=>{$('#ocr-result').innerHTML='<div class="gap"></div><div class="note warn"><strong>Core:</strong> image-only input is unsupported. <strong>Optional OCR:</strong> extracted text would need page alignment and human verification; no OCR engine runs here.</div>';},'model-gates':()=>modal('Local model readiness',`<div class="stack">${[['Permitted model and data','Record licences, provenance and allowed data routes.'],['Resource feasibility','Measure memory, context limits and latency on the actual device.'],['Adapter compatibility','Validate structured outputs, selected citations and explicit failures.'],['Adaptation gate','Use permitted training data, an independent held-out set and a base-model comparison.']].map(([a,b])=>`<div class="list-text"><strong>${a}</strong><p>${b}</p></div>`).join('')}<div class="note neutral">No download, training job or inference service starts from this prototype.</div></div>`,btn('Close','close')),'revision-run':()=>{if(!guard())return;let t=org().tenders.find(t=>t.id==='TG-2401');if(!t)return toast('The illustrative laptop tender is not in this organization.');let id='TG-2401-REV';if(!org().tenders.some(x=>x.id===id)){let n=clone(t);n.id=id;n.version=2;n.delivery=7;n.title='Laptop supply · 40 units (revision)';n.docs=[{id:'tender-2401-v2',name:'Laptop specification.pdf',version:  if(form.id==='profile-form'){let v=Math.max(...org().profiles.map(p=>p.version))+1,old=profile(),p={id:'profile-v'+v,version:v,evidence:clone(old.evidence),goods:$('#fact-goods').value.trim()};if(!p.goods)return toast('Enter goods or services.');for(let key of ['ram','storage','delivery','quantity'])p[key]=Number($('#fact-'+key).value);p.warranty=$('#fact-warranty').value==='unknown'?'unknown':Number($('#fact-warranty').value);p.iso=$('#fact-iso').value==='true';let facts={ram:p.ram,storage:p.storage,delivery:p.delivery,quantity:p.quantity};if(p.warranty!=='unknown')facts.warranty=p.warranty;if(p.iso)facts.iso=true;let id='declaration-v'+v;let d={id,name:'Confirmed company declaration.docx',version:'v'+v,language:'RU',class:'private',kind:'company',state:'ready',locator:'Paragraphs 1–4 · Confirmed applicable offer',facts,quote:`Для данной заявки: ${p.ram} ГБ оперативной памяти, SSD ${p.storage} ГБ, ${p.quantity} ноутбуков, поставка в течение ${p.delivery} календарных дней.${p.warranty!=='unknown'?' Подтверждённая применимая гарантия на оборудование: '+p.warranty+' месяцев с даты приёмки.':''}${p.iso?' Применимый сертификат ISO 9001 подтверждён в данной синтетической декларации.':''}`};org().documents.push(d);p.evidence.push(id);org().profiles.push(p);selectedProfile=v;audit('Company profile version created','completed',p.id);close();render();toast('Profile v'+v+' saved. Existing reports are unchanged.');}
 if(form.id==='upload-form'){let f=$('#upload-file').files[0],outcome=$('#upload-state').value;const error=(m)=>{$('#upload-error').innerHTML=`<div class="gap"></div><div class="note error">${esc(m)}</div>`;};if(!f)return error('Choose a PDF or DOCX file first.');let ext=f.name.split('.').pop().toLowerCase();if(!['pdf','docx'].includes(ext))return error('Unsupported file type. Only PDF and DOCX are accepted.');if(f.size>25*1024*1024)return error('File exceeds the provisional 25 MB demo limit.');if(!f.size)return error('Empty file. Choose a non-empty synthetic document.');if(outcome==='upload-failed')return error('Upload interrupted (simulated). No document metadata was added. Retry when ready.');let id='uploaded-'+Date.now().toString(36),d={id,name:f.name,version:'v1',language:$('#upload-language').value,class:$('#upload-class').value,kind:form.dataset.kind,state:outcome==='unsupported'?'failed':outcome,locator:'Metadata only · no real parsing',quote:outcome==='unsupported'?'Unsupported scan: OCR is not connected.':'No text extracted. This prototype retains file metadata only.'};const versions=d.kind==='company'?org().documents:org().tenders.find(t=>t.id===form.dataset.tender)?.docs||[];d.version='v'+(Math.max(0,...versions.filter(v=>v.name===d.name).map(v=>Number(v.version.replace('v',''))||0))+1);if(d.kind==='company'){org().documents.push(d);let p=clone(profile()),v=Math.max(...org().profiles.map(p=>p.version))+1;p.id='profile-v'+v;p.version=v;p.evidence.push(id);org().profiles.push(p);selectedProfile=v;}else{let t=org().tenders.find(t=>t.id===form.dataset.tender);if(!t)return;t.docs.push(d);}audit('Document metadata added',d.state,id);close();render();toast(d.state==='ready'?'Metadata added. No file was uploaded or parsed.':'Failed/unsupported ingestion recorded. Resolve it before analysis.');}

document.addEventListener('keydown',e=>{if(!$('#overlay-root').children.length)return;if(e.key==='Escape'){close();return;}if(e.key==='Tab'){let focusable=$$('#overlay-root button:not([disabled]),#overlay-root input:not([disabled]),#overlay-root select:not([disabled]),#overlay-root textarea:not([disabled])');if(!focusable.length)return;let first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
