name: Backend foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tenderguard_test
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: tenderguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenderguard_test -d tenderguard_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://tenderguard_test:ci-disposable-password@127.0.0.1:5432/tenderguard_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.26"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13
      - name: Lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migration and schema integration tests
        run: uv run pytest
